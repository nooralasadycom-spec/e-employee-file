<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#405b45">
<title>إضبارتي الوظيفية</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f5ef;
 color:#26372b;
}
header{
 background:#405b45;
 color:white;
 padding:25px 15px;
 text-align:center;
}
header h1{margin:5px;font-size:25px}
header p{margin:8px 0 0;color:#e5eadf}
main{max-width:650px;margin:20px auto;padding:12px}
.intro{
 background:white;padding:20px;border-radius:14px;
 text-align:center;margin-bottom:18px;
}
.sections{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.item{
 background:white;border-radius:12px;
 padding:20px 10px;text-align:center;
 border:1px solid #e2e5dc;
 font-size:16px;
}
.item span{display:block;font-size:25px;margin-bottom:10px}
footer{text-align:center;color:#777;padding:25px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>إضبارتي الوظيفية</h1>
<p>ملفك الوظيفي الإلكتروني</p>
</header>
<main>
<div class="intro">
<h2>مرحباً بك</h2>
<p>احتفظ ببياناتك الوظيفية ووثائقك في مكان واحد.</p>
</div>
<div class="sections">
<div class="item"><span>👤</span>البيانات الشخصية</div>
<div class="item"><span>🏢</span>البيانات الوظيفية</div>
<div class="item"><span>📈</span>الترفيعات</div>
<div class="item"><span>💰</span>العلاوات</div>
<div class="item"><span>📜</span>كتب الشكر والتقدير</div>
<div class="item"><span>🗓️</span>الإجازات</div>
<div class="item"><span>🎓</span>الدورات والشهادات</div>
<div class="item"><span>📂</span>الكتب الرسمية</div>
<div class="item"><span>🪪</span>المستمسكات والوثائق</div>
<div class="item"><span>🔔</span>التنبيهات والاستحقاقات</div>
</div>
</main>
<footer>
إضبارتي الوظيفية © 2026
</footer>
</body>
</html>
